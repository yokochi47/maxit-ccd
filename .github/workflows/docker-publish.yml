name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '0 3 * * 3'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Read requirements.txt
      - name: Load required minimum versions
        run: |
          source requirements.txt
          echo "MIN_MAXIT_VER=$MIN_MAXIT_VER" >> $GITHUB_ENV
          echo "MIN_DDL_VER=$MIN_DDL_VER" >> $GITHUB_ENV
          echo "MIN_PDBX_MMCIF_DIC_VER=$MIN_PDBX_MMCIF_DIC_VER" >> $GITHUB_ENV

      # Determine cache settings based on trigger
      - name: Set cache configuration
        id: cache-config
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "cache-from=" >> $GITHUB_OUTPUT
            echo "cache-to=" >> $GITHUB_OUTPUT
          else
            echo "cache-from=type=gha" >> $GITHUB_OUTPUT
            echo "cache-to=type=gha,mode=max" >> $GITHUB_OUTPUT
          fi

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MIN_MAXIT_VER=${{ env.MIN_MAXIT_VER }}
            MIN_DDL_VER=${{ env.MIN_DDL_VER }}
            MIN_PDBX_MMCIF_DIC_VER=${{ env.MIN_PDBX_MMCIF_DIC_VER }}

      # Sign the resulting Docker image digest.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data. If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
  deploy:
    needs: build  
    runs-on: self-hosted
    steps:
      - name: Deploy to self-hosted servers
        shell: bash
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          docker system info | grep Swarm | grep active > /dev/null || docker swarm init
          docker service ps ${{ github.event.repository.name }} > /dev/null \
            && ((docker service update --force -q --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} ${{ github.event.repository.name }} \
                || true) &) \
            || (docker service create -q --replicas 3 --name ${{ github.event.repository.name }} --update-delay 20s ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} &)
          sleep 60 && [[ `docker images -q -f "dangling=true" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | wc -l` -gt 0 ]] \
            && docker rmi -f $(docker images -q -f "dangling=true" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }})
